<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lady Like ERP</title>

<style>
:root {
  --wine: #650f17;
  --gold: #c58b59;
  --cream: #f8f5eb;
  --sage: #e9eddf;
  --text: #292929;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--cream);
  color: var(--text);
  font-family: system-ui, "Noto Sans Bengali", sans-serif;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
  border: 0;
  border-radius: 9px;
  padding: 11px 15px;
}

input,
select {
  border: 1px solid #ddd4ca;
  padding: 11px;
  border-radius: 8px;
  width: 100%;
  background: white;
}

.primary {
  background: var(--wine);
  color: white;
}

.secondary {
  background: #f3e5da;
  color: var(--wine);
}

/* LOGIN PAGE */

body:has(.auth) {
  min-height: 100vh;
  background: #e9eddf;
}

.auth {
  width: calc(100% - 32px);
  max-width: 440px;
  margin: 7vh auto;
  padding: 35px 30px;
  background: #f8f5eb;
  border: 1px solid #d7dfcc;
  border-radius: 20px;
  box-shadow: 0 15px 45px rgba(48, 65, 45, 0.12);
}

.auth h1 {
  color: var(--wine);
  font-family: Georgia, "Times New Roman", serif;
  font-size: 40px;
  font-weight: 500;
  letter-spacing: 3px;
  text-align: center;
  margin: 0 0 8px;
}

.auth > .muted {
  text-align: center;
  font-family: Georgia, serif;
  font-style: italic;
  font-size: 14px;
  color: #7a675c;
  margin-bottom: 35px;
}

.auth h2 {
  color: var(--wine);
  font-family: Georgia, serif;
  font-size: 23px;
  text-align: center;
  margin-bottom: 25px;
}

.auth label {
  display: block;
  margin: 14px 0 6px;
  font-size: 14px;
  font-weight: 500;
}

.auth input {
  padding: 13px;
  border: 1px solid #ccd4c5;
  border-radius: 10px;
  background: #ffffff;
}
