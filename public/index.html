<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lady Like ERP</title>

<style>
:root {
  --wine:#650f17;
  --gold:#c58b59;
  --cream:#f8f5eb;
  --sage:#e9eddf;
  --text:#292929;
}

* {box-sizing:border-box}

body {
  margin:0;
  background:var(--sage);
  color:var(--text);
  font-family:Arial,system-ui,sans-serif;
}

button,input,select {font:inherit}

button {
  cursor:pointer;
  border:0;
  border-radius:9px;
  padding:11px 15px;
}

input,select {
  border:1px solid #ddd4ca;
  padding:11px;
  border-radius:8px;
  width:100%;
  background:white;
}

.primary {
  background:var(--wine);
  color:white;
}

.secondary {
  background:#f3e5da;
  color:var(--wine);
}

/* LOGIN */

body:has(.auth) {
  background:var(--sage);
  min-height:100vh;
}

.auth {
  width:calc(100% - 32px);
  max-width:440px;
  margin:8vh auto;
  padding:35px 28px;
  background:var(--cream);
  border:1px solid #d2d8c8;
  border-radius:20px;
  box-shadow:0 15px 45px rgba(48,65,45,.12);
}

.auth h1 {
  font-family:Georgia,serif;
  font-size:39px;
  font-weight:500;
  letter-spacing:3px;
  color:var(--wine);
  text-align:center;
  margin:0 0 8px;
}

.auth > .muted {
  text-align:center;
  font-family:Georgia,serif;
  font-style:italic;
  font-size:14px;
  margin-bottom:32px;
}

.auth h2 {
  font-family:Georgia,serif;
  font-size:23px;
  color:var(--wine);
  text-align:center;
  margin-bottom:25px;
}

.auth label {
  display:block;
  margin:14px 0 6px;
  font-size:14px;
  font-weight:500;
}

.auth input {
  padding:13px;
  border:1px solid #ccd4c5;
  border-radius:10px;
}

.auth input:focus {
  outline:2px solid var(--gold);
}

.auth button {
  width:100%;
  margin-top:22px;
  padding:14px;
  border-radius:10px;
  font-weight:600;
}

/* DASHBOARD */

.app {
  display:flex;
  min-height:100vh;
}

.side {
  width:248px;
  flex-shrink:0;
  background:linear-gradient(170deg,#650f17,#420b13);
  color:white;
  padding:24px 14px;
}

.brand {
  font:31px Georgia,serif;
  text-align:center;
  margin:12px 0 4px;
}

.tag {
  text-align:center;
  font-size:12px;
  color:#e4c8b0;
  margin-bottom:32px;
}

.nav {
  display:block;
  width:100%;
  background:transparent;
  color:white;
  text-align:left;
  margin:5px 0;
}

.nav.active,.nav:hover {
  background:#f5e6d8;
  color:var(--wine);
}

.main {
  flex:1;
  min-width:0;
  padding:28px;
}

.top {
  display:flex;
  gap:10px;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
}

.top h1 {
  color:var(--wine);
  font:32px Georgia,serif;
  margin:4px 0;
}

.controls {
  display:flex;
  gap:9px;
  align-items:center;
}

.controls select {width:auto}

.muted {color:#817a77}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(185px,1fr));
  gap:15px;
  margin-top:24px;
}

.card,.panel {
  background:white;
  border:1px solid #efe6dc;
  border-radius:16px;
  padding:20px;
  box-shadow:0 6px 20px #650f1708;
}

.card {min-height:132px}

.card h3 {
  font-size:14px;
  margin:0 0 18px;
}

.card strong {
  font-size:25px;
  color:var(--wine);
}

.row {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
  margin-top:20px;
}

.panel h2 {
  font-size:19px;
  color:var(--wine);
}

.panel input,.panel select {
  margin:6px 0 12px;
}

.notice {
  background:#fff4e7;
  padding:12px;
  border-radius:9px;
  margin-top:16px;
}

.small {font-size:13px}

.line {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  border-bottom:1px solid #eee;
  padding:9px 0;
}

.hidden {display:none!important}
.error {color:#b00020}
.success {color:#1c7139}

table {
  width:100%;
  border-collapse:collapse;
}

td,th {
  padding:11px;
  border-bottom:1px solid #eee;
  text-align:left;
  font-size:14px;
}

.stack {
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.stack > * {
  flex:1;
  min-width:130px;
}

#loading {
  text-align:center;
  padding:35px 20px;
  color:var(--wine);
}

#debugError {
  display:none;
  max-width:600px;
  margin:20px auto;
  padding:15px;
  background:#fff0f0;
  color:#9b1020;
  border-radius:10px;
  overflow-wrap:anywhere;
}

@media(max-width:820px) {
  .app {display:block}

  .side {
    width:auto;
    padding:10px;
    display:flex;
    flex-wrap:wrap;
    gap:3px;
  }

  .brand {
    font-size:22px;
    margin:5px 10px;
  }

  .tag {display:none}

  .nav {
    width:auto;
    font-size:12px;
    margin:0;
    padding:8px;
  }

  .main {padding:17px}

  .row {grid-template-columns:1fr}

  .top h1 {font-size:26px}

  .auth {
    margin:8vh auto;
    padding:30px 23px;
  }

  .auth h1 {font-size:34px}
}
</style>
</head>

<body>

<div id="root">
  <div id="loading">
    <h1 style="font-family:Georgia,serif">
      LADY LIKE
    </h1>
    <p>Loading ERP...</p>
  </div>
</div>

<div id="debugError"></div>

<script>
window.addEventListener('error',function(e){
  const box=document.getElementById('debugError');
  if(box){
    box.style.display='block';
    box.textContent='JavaScript Error: '+e.message;
  }
});

window.addEventListener('unhandledrejection',function(e){
  const box=document.getElementById('debugError');
  if(box){
    box.style.display='block';
    box.textContent='Application Error: '+String(e.reason);
  }
});
</script>

<script src="/app.js?v=20261024fix"></script>

</body>
</html>
